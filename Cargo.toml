[workspace]
members = ["src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.9"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
mclr-core = { path = "crates/mclr-core" }
mclr-net = { path = "crates/mclr-net" }
mclr-game = { path = "crates/mclr-game" }
mclr-auth = { path = "crates/mclr-auth" }
mclr-loaders = { path = "crates/mclr-loaders" }
mclr-comp = { path = "crates/mclr-comp" }
mclr-saves = { path = "crates/mclr-saves" }
mclr-crash = { path = "crates/mclr-crash" }
mclr-update = { path = "crates/mclr-update" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "socks", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = "2"
flate2 = "1"
toml = "0.8"
fastnbt = "2"
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls", "tokio-runtime"] }
winreg = "0.55"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "v3", "serde"] }
url = { version = "2", features = ["serde"] }
dirs = "6"
tempfile = "3"
wiremock = "0.6"
clap = { version = "4", features = ["derive"] }
window-vibrancy = "0.5"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = "0.0.9"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
trash = "5"
jsonwebtoken = "9"
regex = "1"
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
